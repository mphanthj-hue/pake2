name: 'Pake: Build Desktop App'

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "10.26.2"

on:
  workflow_dispatch:
    inputs:
      # ═══ CORE ═══
      platform:
        description: "Platform"
        required: true
        default: "windows-latest"
        type: choice
        options:
          - "windows-latest"
          - "macos-latest"
          - "ubuntu-24.04"
      url:
        description: "Website URL"
        required: true
      name:
        description: "App name (lowercase for Linux)"
        required: true
      icon:
        description: "Icon URL (auto-fetch if empty)"
        required: false
      app_version:
        description: "App version"
        required: false
        default: "1.0.0"

      # ═══ WINDOW ═══
      width:
        description: "Window width (px)"
        required: false
        default: "1200"
      height:
        description: "Window height (px)"
        required: false
        default: "780"
      fullscreen:
        description: "Start in fullscreen mode"
        required: false
        type: boolean
        default: false
      maximize:
        description: "Start with maximized window"
        required: false
        type: boolean
        default: false
      hide_title_bar:
        description: "Hide title bar (macOS)"
        required: false
        type: boolean
        default: false
      always_on_top:
        description: "Keep window always on top"
        required: false
        type: boolean
        default: false
      title:
        description: "Custom window title"
        required: false

      # ═══ BEHAVIOR ═══
      incognito:
        description: "Private mode (no cookies/storage)"
        required: false
        type: boolean
        default: false
      multi_window:
        description: "Allow multiple windows"
        required: false
        type: boolean
        default: false
      force_internal_navigation:
        description: "Keep all links inside app"
        required: false
        type: boolean
        default: false
      safe_domain:
        description: "Comma-separated trusted domains"
        required: false
      dark_mode:
        description: "Force dark mode"
        required: false
        type: boolean
        default: false
      show_system_tray:
        description: "Show system tray icon"
        required: false
        type: boolean
        default: false

      # ═══ NETWORK ═══
      proxy_url:
        description: "Proxy URL (e.g. http://127.0.0.1:7890)"
        required: false
      user_agent:
        description: "Custom browser user agent"
        required: false

      # ═══ BUILD ═══
      debug:
        description: "Enable dev tools + detailed logging"
        required: false
        type: boolean
        default: false
      keep_binary:
        description: "Keep standalone binary alongside installer"
        required: false
        type: boolean
        default: false
      targets:
        description: "Linux: deb,appimage,rpm,zst | macOS: dmg | Windows: msi"
        required: false
      installer_language:
        description: "MSI language (e.g. en-US, zh-CN, ja-JP)"
        required: false

      # ═══ ADVANCED ═══
      inject:
        description: "Inject local CSS/JS (comma-separated paths)"
        required: false
      hide_on_close:
        description: "Hide to tray on close instead of exiting"
        required: false
        type: boolean
        default: false
      start_to_tray:
        description: "Start app minimized to system tray"
        required: false
        type: boolean
        default: false
      enable_find:
        description: "Enable in-page Find (Ctrl+F/Cmd+F)"
        required: false
        type: boolean
        default: false
      enable_drag_drop:
        description: "Enable drag & drop file upload"
        required: false
        type: boolean
        default: false
      ignore_certificate_errors:
        description: "Ignore SSL/TLS certificate errors (internal certs)"
        required: false
        type: boolean
        default: false
      wasm:
        description: "Enable WebAssembly support (Flutter Web, etc.)"
        required: false
        type: boolean
        default: false
      new_window:
        description: "Allow sites to open new windows (auth flows)"
        required: false
        type: boolean
        default: false
      activation_shortcut:
        description: "Shortcut to activate app (e.g. CtrlShiftV)"
        required: false

jobs:
  build:
    name: Build ${{ inputs.name || 'App' }} on ${{ inputs.platform }}
    runs-on: ${{ inputs.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Setup Node.js Environment
        uses: pnpm/action-setup@v4
        id: pnpm-install
        with:
          node-version: ${{ env.NODE_VERSION }}
          package_json_file: package.json

      - name: Setup pnpm
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install

      - name: Build CLI
        run: pnpm run cli:build

      - name: Rust cache restore
        uses: actions/cache/restore@v4.2.0
        id: cache_restore
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: ${{ runner.os }}-cargo-pake-${{ hashFiles('**/Cargo.lock') }}

      - name: Build JSON config and run Pake
        shell: bash
        run: |
          CONFIG_FILE=$(mktemp /tmp/pake-config-XXXXXX.json)
          
          jq -n \
            --arg url "${{ inputs.url }}" \
            --arg name "${{ inputs.name }}" \
            '{$url, $name}' > "$CONFIG_FILE"
          
          [ -n "${{ inputs.width }}" ] && jq --arg v "${{ inputs.width }}" '.width = ($v|tonumber)' "$CONFIG_FILE" > "${CONFIG_FILE}.tmp" && mv "${CONFIG_FILE}.tmp" "$CONFIG_FILE"
          [ -n "${{ inputs.height }}" ] && jq --arg v "${{ inputs.height }}" '.height = ($v|tonumber)' "$CONFIG_FILE" > "${CONFIG_FILE}.tmp" && mv "${CONFIG_FILE}.tmp" "$CONFIG_FILE"
          [ -n "${{ inputs.icon }}" ] && jq --arg v "${{ inputs.icon }}" '.icon = $v' "$CONFIG_FILE" > "${CONFIG_FILE}.tmp" && mv "${CONFIG_FILE}.tmp" "$CONFIG_FILE"
          [ -n "${{ inputs.app_version }}" ] && jq --arg v "${{ inputs.app_version }}" '.appVersion = $v' "$CONFIG_FILE" > "${CONFIG_FILE}.tmp" && mv "${CONFIG_FILE}.tmp" "$CONFIG_FILE"
          [ -n "${{ inputs.title }}" ] && jq --arg v "${{ inputs.title }}" '.title = $v' "$CONFIG_FILE" > "${CONFIG_FILE}.tmp" && mv "${CONFIG_FILE}.tmp" "$CONFIG_FILE"
          [ -n "${{ inputs.safe_domain }}" ] && jq --arg v "${{ inputs.safe_domain }}" '.safeDomain = $v' "$CONFIG_FILE" > "${CONFIG_FILE}.tmp" && mv "${CONFIG_FILE}.tmp" "$CONFIG_FILE"
          [ -n "${{ inputs.proxy_url }}" ] && jq --arg v "${{ inputs.proxy_url }}" '.proxyUrl = $v' "$CONFIG_FILE" > "${CONFIG_FILE}.tmp" && mv "${CONFIG_FILE}.tmp" "$CONFIG_FILE"
          [ -n "${{ inputs.user_agent }}" ] && jq --arg v "${{ inputs.user_agent }}" '.userAgent = $v' "$CONFIG_FILE" > "${CONFIG_FILE}.tmp" && mv "${CONFIG_FILE}.tmp" "$CONFIG_FILE"
          [ -n "${{ inputs.targets }}" ] && jq --arg v "${{ inputs.targets }}" '.targets = ($v | split(","))' "$CONFIG_FILE" > "${CONFIG_FILE}.tmp" && mv "${CONFIG_FILE}.tmp" "$CONFIG_FILE"
          [ -n "${{ inputs.installer_language }}" ] && jq --arg v "${{ inputs.installer_language }}" '.installerLanguage = $v' "$CONFIG_FILE" > "${CONFIG_FILE}.tmp" && mv "${CONFIG_FILE}.tmp" "$CONFIG_FILE"
          [ -n "${{ inputs.inject }}" ] && jq --arg v "${{ inputs.inject }}" '.inject = ($v | split(","))' "$CONFIG_FILE" > "${CONFIG_FILE}.tmp" && mv "${CONFIG_FILE}.tmp" "$CONFIG_FILE"
          
          # Booleans (camelCase!)
          [ "${{ inputs.fullscreen }}" == "true" ] && jq '.fullscreen = true' "$CONFIG_FILE" > "${CONFIG_FILE}.tmp" && mv "${CONFIG_FILE}.tmp" "$CONFIG_FILE"
          [ "${{ inputs.maximize }}" == "true" ] && jq '.maximize = true' "$CONFIG_FILE" > "${CONFIG_FILE}.tmp" && mv "${CONFIG_FILE}.tmp" "$CONFIG_FILE"
          [ "${{ inputs.hide_title_bar }}" == "true" ] && jq '.hideTitleBar = true' "$CONFIG_FILE" > "${CONFIG_FILE}.tmp" && mv "${CONFIG_FILE}.tmp" "$CONFIG_FILE"
          [ "${{ inputs.always_on_top }}" == "true" ] && jq '.alwaysOnTop = true' "$CONFIG_FILE" > "${CONFIG_FILE}.tmp" && mv "${CONFIG_FILE}.tmp" "$CONFIG_FILE"
          [ "${{ inputs.incognito }}" == "true" ] && jq '.incognito = true' "$CONFIG_FILE" > "${CONFIG_FILE}.tmp" && mv "${CONFIG_FILE}.tmp" "$CONFIG_FILE"
          [ "${{ inputs.multi_window }}" == "true" ] && jq '.multiWindow = true' "$CONFIG_FILE" > "${CONFIG_FILE}.tmp" && mv "${CONFIG_FILE}.tmp" "$CONFIG_FILE"
          [ "${{ inputs.force_internal_navigation }}" == "true" ] && jq '.forceInternalNavigation = true' "$CONFIG_FILE" > "${CONFIG_FILE}.tmp" && mv "${CONFIG_FILE}.tmp" "$CONFIG_FILE"
          [ "${{ inputs.dark_mode }}" == "true" ] && jq '.darkMode = true' "$CONFIG_FILE" > "${CONFIG_FILE}.tmp" && mv "${CONFIG_FILE}.tmp" "$CONFIG_FILE"
          [ "${{ inputs.show_system_tray }}" == "true" ] && jq '.showSystemTray = true' "$CONFIG_FILE" > "${CONFIG_FILE}.tmp" && mv "${CONFIG_FILE}.tmp" "$CONFIG_FILE"
          [ "${{ inputs.debug }}" == "true" ] && jq '.debug = true' "$CONFIG_FILE" > "${CONFIG_FILE}.tmp" && mv "${CONFIG_FILE}.tmp" "$CONFIG_FILE"
          [ "${{ inputs.keep_binary }}" == "true" ] && jq '.keepBinary = true' "$CONFIG_FILE" > "${CONFIG_FILE}.tmp" && mv "${CONFIG_FILE}.tmp" "$CONFIG_FILE"
          [ "${{ inputs.hide_on_close }}" == "true" ] && jq '.hideOnClose = true' "$CONFIG_FILE" > "${CONFIG_FILE}.tmp" && mv "${CONFIG_FILE}.tmp" "$CONFIG_FILE"
          [ "${{ inputs.start_to_tray }}" == "true" ] && jq '.startToTray = true' "$CONFIG_FILE" > "${CONFIG_FILE}.tmp" && mv "${CONFIG_FILE}.tmp" "$CONFIG_FILE"
          [ "${{ inputs.enable_find }}" == "true" ] && jq '.enableFind = true' "$CONFIG_FILE" > "${CONFIG_FILE}.tmp" && mv "${CONFIG_FILE}.tmp" "$CONFIG_FILE"
          [ "${{ inputs.enable_drag_drop }}" == "true" ] && jq '.enableDragDrop = true' "$CONFIG_FILE" > "${CONFIG_FILE}.tmp" && mv "${CONFIG_FILE}.tmp" "$CONFIG_FILE"
          [ "${{ inputs.ignore_certificate_errors }}" == "true" ] && jq '.ignoreCertificateErrors = true' "$CONFIG_FILE" > "${CONFIG_FILE}.tmp" && mv "${CONFIG_FILE}.tmp" "$CONFIG_FILE"
          [ "${{ inputs.wasm }}" == "true" ] && jq '.wasm = true' "$CONFIG_FILE" > "${CONFIG_FILE}.tmp" && mv "${CONFIG_FILE}.tmp" "$CONFIG_FILE"
          [ "${{ inputs.new_window }}" == "true" ] && jq '.newWindow = true' "$CONFIG_FILE" > "${CONFIG_FILE}.tmp" && mv "${CONFIG_FILE}.tmp" "$CONFIG_FILE"
          [ -n "${{ inputs.activation_shortcut }}" ] && jq --arg v "${{ inputs.activation_shortcut }}" '.activationShortcut = $v' "$CONFIG_FILE" > "${CONFIG_FILE}.tmp" && mv "${CONFIG_FILE}.tmp" "$CONFIG_FILE"
          
          echo "=== Pake Config ==="
          cat "$CONFIG_FILE"
          echo "==================="
          
          node dist/cli.js --config "$CONFIG_FILE"
          
          rm -f "$CONFIG_FILE"

      - name: Check Telegram configuration
        id: check_telegram
        run: |
          if [ -n "${{ secrets.TELEGRAM_TOKEN }}" ] && [ -n "${{ secrets.TELEGRAM_CHAT_ID }}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi
        shell: bash

      - name: Send Telegram notification (success)
        if: steps.check_telegram.outputs.configured == 'true' && !cancelled() && success()
        uses: appleboy/telegram-action@v1.0.1
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          format: markdown
          message: |
            ✅ *Build thành công!*
            
            *App*: ${{ inputs.name }}
            *URL*: ${{ inputs.url }}
            *Platform*: ${{ inputs.platform }}
            
            ⏱️ ${{ github.run_id }}
            🔗 [Xem chi tiết](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

      - name: Send Telegram notification (failure)
        if: steps.check_telegram.outputs.configured == 'true' && failure()
        uses: appleboy/telegram-action@v1.0.1
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          format: markdown
          message: |
            ❌ *Build thất bại!*
            
            *App*: ${{ inputs.name }}
            *Platform*: ${{ inputs.platform }}
            
            🔗 [Xem log](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

      - name: Upload standalone binary
        if: ${{ inputs.keep_binary == 'true' }}
        uses: actions/upload-artifact@v6
        with:
          name: ${{ inputs.name }}-binary-${{ runner.os }}
          path: |
            ${{ inputs.name }}-binary
            ${{ inputs.name }}.exe
          retention-days: 3
          if-no-files-found: ignore

      - name: Upload macOS .app (iterative/debug)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v6
        with:
          name: ${{ inputs.name }}-macOS-app
          path: ${{ inputs.name }}.app
          retention-days: 3
          if-no-files-found: ignore

      - name: Upload DMG (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v6
        with:
          name: ${{ inputs.name }}-macOS
          path: ${{ inputs.name }}.dmg
          retention-days: 3
          if-no-files-found: ignore

      - name: Upload DEB (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v6
        with:
          name: ${{ inputs.name }}-Linux-deb
          path: ${{ inputs.name }}.deb
          retention-days: 3
          if-no-files-found: ignore

      - name: Upload AppImage (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v6
        with:
          name: ${{ inputs.name }}-Linux-AppImage
          path: ${{ inputs.name }}.AppImage
          retention-days: 3
          if-no-files-found: ignore

      - name: Upload RPM (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v6
        with:
          name: ${{ inputs.name }}-Linux-rpm
          path: ${{ inputs.name }}.rpm
          retention-days: 3
          if-no-files-found: ignore

      - name: Upload ZST (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v6
        with:
          name: ${{ inputs.name }}-Linux-zst
          path: ${{ inputs.name }}-*.pkg.tar.zst
          retention-days: 3
          if-no-files-found: ignore

      - name: Upload MSI (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v6
        with:
          name: ${{ inputs.name }}-Windows
          path: ${{ inputs.name }}.msi
          retention-days: 3

      - name: Generate build summary
        if: always()
        run: |
          echo "## 📱 Build Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Detail |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| **App Name** | ${{ inputs.name }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **URL** | ${{ inputs.url }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Platform** | ${{ inputs.platform }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Version** | ${{ inputs.app_version }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Dark Mode** | ${{ inputs.dark_mode }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Maximize** | ${{ inputs.maximize }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Multi Window** | ${{ inputs.multi_window }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **System Tray** | ${{ inputs.show_system_tray }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Hide on Close** | ${{ inputs.hide_on_close }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Start to Tray** | ${{ inputs.start_to_tray }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **In-page Find** | ${{ inputs.enable_find }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Incognito** | ${{ inputs.incognito }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Force Internal Nav** | ${{ inputs.force_internal_navigation }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Result** | ${{ job.status }} |" >> $GITHUB_STEP_SUMMARY

      - name: Rust cache store
        uses: actions/cache/save@v4.2.0
        if: steps.cache_store.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: ${{ runner.os }}-cargo-pake-${{ hashFiles('**/Cargo.lock') }}
